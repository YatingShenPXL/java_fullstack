version: '3.8'

services:
  mysql-employee:
    image: mysql:8.0
    container_name: mysql-employee
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_db
    ports:
      - "3308:3306"
    volumes:
      - employee_data:/var/lib/mysql

  mysql-department:
    image: mysql:8.0
    container_name: mysql-department
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: department_db
    ports:
      - "3307:3306"
    volumes:
      - department_data:/var/lib/mysql

  mysql-organization:
    image: mysql:8.0
    container_name: mysql-organization
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: organization_db
    ports:
      - "3309:3306"
    volumes:
      - organization_data:/var/lib/mysql

volumes:
  employee_data:
  department_data:
  organization_data: