version: '3.8'

services:
  mysql-employee:
    image: mysql:8.0
    container_name: mysql-employee
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_db
    ports:
      - "3308:3306"
    volumes:
      - employee_data:/var/lib/mysql

  mysql-department:
    image: mysql:8.0
    container_name: mysql-department
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: department_db
    ports:
      - "3307:3306"
    volumes:
      - department_data:/var/lib/mysql

  mysql-organization:
    image: mysql:8.0
    container_name: mysql-organization
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: organization_db
    ports:
      - "3309:3306"
    volumes:
      - organization_data:/var/lib/mysql

  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

volumes:
  employee_data:
  department_data:
  organization_data: